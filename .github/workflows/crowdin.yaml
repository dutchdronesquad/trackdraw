---
name: Crowdin

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - crowdin.yml
      - lang/en-US/*.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-main
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize translations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v3.0.1
        with:
          upload_sources: true
          upload_translations: false
          download_translations: ${{ github.event_name == 'workflow_dispatch' }}
          skip_untranslated_strings: true
          push_translations: ${{ github.event_name == 'workflow_dispatch' }}
          localization_branch_name: l10n_crowdin
          crowdin_branch_name: main
          create_pull_request: ${{ github.event_name == 'workflow_dispatch' }}
          pull_request_base_branch_name: main
          pull_request_title: "chore(i18n): sync Crowdin translations"
          pull_request_body: >-
            Automated translation update generated by the official Crowdin
            GitHub Action. Review the locale diff and required checks before
            merging.
          pull_request_labels: maintenance
          commit_message: "chore(i18n): sync Crowdin translations"
          github_user_name: Crowdin Bot
          github_user_email: support+bot@crowdin.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
