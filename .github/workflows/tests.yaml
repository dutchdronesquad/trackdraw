---
name: Tests

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_NODE: 24

jobs:
  desktop-build:
    name: Tauri application (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: Set up stable Rust
        run: rustup update stable --no-self-update
      - name: Install Linux webview prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm --prefix experiments/tauri-desktop ci
      - name: Compile the real native application and embedded renderer
        run: npm --prefix experiments/tauri-desktop run package -- --debug --no-bundle

  desktop-storage:
    name: Rust desktop storage (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
      - name: Set up stable Rust
        run: rustup update stable --no-self-update
      - name: Check native storage, migration and offline assets
        run: cargo +stable test --manifest-path experiments/tauri-desktop/src-tauri/Cargo.toml --locked --no-default-features

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci
      - name: Build the real Rust repository for browser/desktop round-trip tests
        run: cargo build --manifest-path experiments/tauri-desktop/src-tauri/Cargo.toml --locked --no-default-features --bin repository-cli
      - name: 🚀 Run Vitest with coverage
        run: npm run test:coverage
      - name: 📊 Upload Vitest coverage report
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        if: always()
