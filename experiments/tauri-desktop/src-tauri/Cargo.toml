[package]
name = "trackdraw-desktop"
version = "0.0.0"
edition = "2021"
default-run = "trackdraw-desktop"

[features]
default = ["desktop", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
dirs = "6"

[[bin]]
name = "repository-cli"
path = "src/bin/repository-cli.rs"

[[bin]]
name = "trackdraw-desktop"
path = "src/main.rs"
required-features = ["desktop"]
